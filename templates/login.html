<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Login</h1>

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST">

            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                required
                autocomplete="username">

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                autocomplete="current-password">

            <button type="submit">Entrar</button>

        </form>

    </div>

</body>
</html>
