<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-vindas</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Boas-vindas!</h1>

        <p>Olá, <strong>{{ usuario }}</strong>!</p>

        <form action="{{ url_for('sair') }}" method="POST">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}">

            <button type="submit">
                Sair
            </button>
        </form>

    </div>

</body>
</html>
